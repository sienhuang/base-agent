[project]
name = "base-agent-next-starter"
version = "0.1.0"
description = "A progressive, copyable application for testing base-agent capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "base-agent-next[openai,server]==0.1.0",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
postgres = [
    "base-agent-next[postgres]==0.1.0",
]

[tool.uv.sources]
base-agent-next = { path = "..", editable = true }

[dependency-groups]
dev = [
    "base-agent-next[postgres]==0.1.0",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[project.scripts]
agent-app = "agent_app.cli:main"
agent-server = "agent_app.asgi:main"
agent-worker = "agent_app.worker:main"
execution-worker = "agent_app.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["../src", "src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_app"]
