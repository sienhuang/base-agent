[project]
name = "base-agent-next"
version = "0.1.0"
description = "A clean Agent SDK core with an invisible runtime harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
openai = [
    "openai>=2,<3",
]
server = [
    "fastapi>=0.115,<1",
    "sse-starlette>=3,<4",
    "uvicorn>=0.30,<1",
]
postgres = [
    "asyncpg>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/base_agent"]

[dependency-groups]
dev = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "sse-starlette>=3,<4",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["base_agent"]
mypy_path = "src"
